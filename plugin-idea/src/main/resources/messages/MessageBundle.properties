about.title=About
about.description1=Vibe Action is a command router for shell and LLM tasks, configured through YAML pipelines. Every action in this panel is a pipeline \u2014 built-in or your own, defined in plain YAML files.
about.description2=The panel discovers all available actions on its own, including custom ones, and runs them with visible feedback \u2014 no per-project configuration, no hand-editing tasks.json or External Tools.
about.description3=This plugin and the VS Code extension are built from one codebase, so the panel looks native in both\: Jewel-themed inside IntelliJ, and following the editor's own theme in VS Code.
about.requirement=Requires the vibe-action CLI installed and available on PATH. It works standalone too \u2014 the plugin just removes the friction.

