about.title=О плагине
about.description1=Vibe Action \u2014 маршрутизатор команд для shell и LLM-задач, настраиваемый через YAML-пайплайны. Каждое действие в панели \u2014 это пайплайн\: встроенный или ваш собственный, описанный в обычном YAML-файле.
about.description2=Панель сама находит все доступные действия, включая пользовательские, и запускает их с видимой обратной связью \u2014 без настройки для каждого проекта и без ручного редактирования tasks.json и External Tools.
about.description3=Этот плагин и расширение VS Code собраны из одной кодовой базы, поэтому панель выглядит нативно в обоих\: тема Jewel внутри IntelliJ и собственная тема редактора в VS Code.
about.requirement=Требуется CLI vibe-action, установленный и доступный через PATH. Он работает и сам по себе \u2014 плагин лишь убирает лишние шаги.

