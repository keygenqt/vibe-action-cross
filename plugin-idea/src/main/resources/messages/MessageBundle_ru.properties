about.title=О плагине
about.description1=Эта панель отрисовывается из единой кодовой базы Kotlin Multiplatform / Compose Multiplatform \u2014 один UI, две платформы\: плагин для IntelliJ Platform и расширение для VS Code.
about.description2=Платформенные различия проходят через Bridge, а не через ветвление кода \u2014 нативный вид обеспечивает Jewel внутри IntelliJ, а в вебвью VS Code используется её собственная тема.
about.requirement=Требуется CLI vibe-action, установленный и доступный через PATH.

